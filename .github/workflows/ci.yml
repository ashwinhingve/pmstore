name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/build
          NEXTAUTH_SECRET: build-only-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
