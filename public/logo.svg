<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PM Store logo lockup — capsule-cross mark, "PM Store" wordmark, slogan -->
  <!-- Colors: paper #FBFAF7 bg, ink #16233A cross/PM, mint #0E8F6E pill, ink-70 #56607A "Store"/slogan -->
  <rect width="512" height="512" fill="#FBFAF7" />

  <!-- Mark: 64-unit artwork scaled and centred near the top -->
  <g transform="translate(181,52) scale(2.34)">
    <rect x="11" y="26" width="42" height="12" rx="6" fill="#16233A" />
    <rect x="26" y="8" width="12" height="48" rx="6" fill="#0E8F6E" />
    <rect x="26.8" y="30.8" width="10.4" height="2.2" rx="1" fill="#FBFAF7" opacity="0.9" />
    <rect x="28.6" y="12" width="2.6" height="13" rx="1.3" fill="#FBFAF7" opacity="0.4" />
  </g>

  <!-- Wordmark -->
  <text x="256" y="332" text-anchor="middle" font-family="'Bricolage Grotesque', 'Public Sans', system-ui, Arial, sans-serif" font-size="76" letter-spacing="-2">
    <tspan font-weight="800" fill="#16233A">PM</tspan><tspan font-weight="500" fill="#56607A"> Store</tspan>
  </text>

  <!-- Slogan -->
  <text x="256" y="378" text-anchor="middle" font-family="'Public Sans', system-ui, Arial, sans-serif" font-size="26" font-weight="500" fill="#56607A">Genuine medicines, generic prices</text>
</svg>
